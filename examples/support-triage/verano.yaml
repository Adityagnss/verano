# Started with `verano init`, then the TODOs were filled in (task, data, models, gate).
# Check it with `verano validate`, then `verano push` and `verano run`.

version: 1
project: "support-triage"
keys:
  openai: env:OPENAI_API_KEY
prompts:
  # `ticket` is now `attachment`: each test case's input is sent there.
  - name: classify-ticket
    source: {file: "app/triage.py", line: 17}
    system: |-
      You are a support triage assistant for an online shop.
      Read the customer's ticket and reply with exactly one word: billing, shipping or technical.

      billing   - charges, refunds, invoices, payment problems
      shipping  - delivery, tracking, lost or damaged parcels
      technical - the website or app not working, login problems, bugs
    user: "Ticket: {{ attachment }}"
    params: {temperature: 0, max_tokens: 5}
    task:
      type: classification
      goal: Route each support ticket to the team that should handle it
      allowed_outputs: [billing, shipping, technical]
    data:
      cases: {file: data/tickets.csv, input: ticket, expected: expected}   # one test case per row
    models: [gpt-4o-mini, gpt-4o]
    runs: 2                          # run each model twice to see how steady its answers are
    budget: 1.00                     # stop the run if it has spent a dollar
    gate: {min_quality: 0.85, max_drop: 0.05}   # what `verano run --ci` demands

