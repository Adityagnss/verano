# Part of the real-model check kit (DEVELOPMENT.md, H5 step 5.0). Runs on a free local model;
# change `keys` and `models` to try a real provider. Check it with `verano validate`.

version: 1
project: "kit-summarization"
keys:
  ollama: none
prompts:
  - name: one-line-summary
    system: |-
      Summarise the news text in one sentence of at most 30 words.
      Use only facts from the text.
    user: "{{ attachment }}"
    params: {temperature: 0, max_tokens: 80}
    task:
      type: summarization
      goal: Write a one-sentence summary of a short news text
      constraints: [one sentence, at most 30 words, no facts that are not in the text]
    data:
      cases: {file: data/cases.csv, input: article, rubric: rubric}
    judge: "qwen2.5:3b"   # the same model judges itself here; use a stronger judge for check 5.5
    models: ["qwen2.5:3b"]
    runs: 2
