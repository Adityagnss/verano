# Part of the real-model check kit (DEVELOPMENT.md, H5 step 5.0). Runs on a free local model;
# change `keys` and `models` to try a real provider. Check it with `verano validate`.

version: 1
project: "kit-question-answering"
keys:
  ollama: none
prompts:
  - name: answer-from-context
    system: |-
      Answer the question using only the context. Reply with the short answer only, no sentence.
      If the context does not contain the answer, reply: unknown
    user: "{{ attachment }}"
    params: {temperature: 0, max_tokens: 30}
    task:
      type: question_answering
      goal: Answer a question from the short context given with it
      constraints: [answer only from the context, short answer only]
    data:
      cases: {file: data/cases.csv, input: question, expected: expected}
    models: ["qwen2.5:3b"]
    runs: 2
