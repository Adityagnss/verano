[project]
name = "verano-sdk"
dynamic = ["version"]
description = "Fetch the prompt Verano serves for a label (production, staging) in your app, with a local cache and a safe fallback."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["llm", "prompts", "verano", "prompt-management"]
authors = [{ name = "Verano contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/verano/verano"
Changelog = "https://github.com/verano/verano/blob/main/sdk/python/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/verano_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verano_sdk"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET", "ERA"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
