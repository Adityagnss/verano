      - {kind: test, ref: backend/tests/unit/traffic/test_adapters.py, note: "and spans we wrote"}
      - {kind: record, ref: integrations/evidence/otel-validation.md}
    verified_with: opentelemetry-exporter-otlp-proto-http 1.45.2 (Python). The JavaScript exporter was not run.
