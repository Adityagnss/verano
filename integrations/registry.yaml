# The one list of integrations. The README, the integrations page, the comparison artifact and (later) the website are all
# generated from this file by scripts/integrations.py; `make integrations` regenerates them and a test fails when they drift.
#
# status (what has been shown, strongest last):
#   planned        not built.
#   built          the code exists; no automated test of this integration.
#   sample_tested  automated tests pass against stand-in objects or sample files we wrote.
#   validated      checked against the real third-party tool or library (version and date recorded), not stand-ins.
# Nothing here is counted as an integration because it is "theoretically compatible": a row needs the evidence for its status.
#
# group: native_sdk | framework_adapter | observability_import | ci_integration
# logo: a Simple Icons slug whose file is in integrations/logos, or null with a short `chip` text instead.
version: 1
integrations:
  # -- Native SDKs -------------------------------------------------------------------------------------------------
  - id: python-sdk
    name: Python SDK
    group: native_sdk
    status: sample_tested
    logo: python
    summary: Fetch the prompt a label points at, with a saved copy for outages (`verano-sdk`, standard library only).
    where: sdk/python
    evidence:
      - {kind: test, ref: sdk/python/tests/test_client.py, note: "14 tests against a fake Verano"}
      - {kind: record, ref: integrations/evidence/packaging.md, note: "builds and installs in a clean environment"}
    distribution: not published to PyPI
    next_step: Publish to PyPI (you run it; commands in the packaging record), then run it against a real stack.
  - id: typescript-sdk
    name: TypeScript SDK
    group: native_sdk
    status: sample_tested
    logo: typescript
    summary: The same fetch, cache and fallback for Node, Bun and Deno (`@verano/sdk`, no dependencies).
    where: sdk/typescript
    evidence:
      - {kind: test, ref: sdk/typescript/tests/client.test.ts, note: "14 tests against a fake fetch"}
      - {kind: record, ref: integrations/evidence/packaging.md, note: "builds and installs in a clean folder"}
    distribution: not published to npm
    next_step: Publish to npm (you run it; commands in the packaging record), then run it against a real stack.
  - id: cli
    name: Command line (`verano`)
    group: native_sdk
    status: sample_tested
    logo: null
    chip: CLI
    summary: Scan your code for prompts, push, run, gate a pull request, bring in traces, connect your app.
    where: cli
    evidence:
      - {kind: test, ref: cli/tests/test_run.py, note: "against a fake platform"}
      - {kind: test, ref: cli/tests/test_init.py}
      - {kind: record, ref: integrations/evidence/packaging.md, note: "builds and installs in a clean environment"}
    distribution: not published to PyPI
    next_step: Publish to PyPI (you run it), then install it on a clean machine with uvx.
  - id: mcp-server
    name: MCP server (`verano mcp`)
    group: native_sdk
    status: sample_tested
    logo: modelcontextprotocol
    summary: Lets an AI agent list projects, read results and, only with `--allow-write`, start runs and move labels.
    where: cli/src/verano/mcp
    evidence:
      - {kind: test, ref: cli/tests/test_integrations.py, note: "protocol, schemas and refusals; no real agent client"}
    next_step: Try it with a real MCP client (pending check 28).

  # -- Framework adapters -----------------------------------------------------------------------------------------
  - id: pytest-plugin
    name: pytest plugin
    group: framework_adapter
    status: validated
    logo: pytest
    summary: "`verano.test(case, fn)` checks your function in a normal pytest run and writes a JSON report."
    where: cli/src/verano/pytest_plugin.py
    evidence:
      - {kind: test, ref: cli/tests/test_integrations.py, note: "runs the real pytest in a subprocess with the plugin loaded"}
    verified_with: pytest 9.1.1
    verified_on: "2026-11-10"
  - id: langchain-adapter
    name: LangChain adapter
    group: framework_adapter
    status: validated
    logo: langchain
    summary: Makes a LangChain runnable or chain callable by `verano.test` and `verano.serve`.
    where: cli/src/verano/adapters.py
    evidence:
      - {kind: test, ref: cli/tests/test_adapters_real.py, note: "a real chain and runnable, no network"}
      - {kind: test, ref: cli/tests/test_integrations.py, note: "and against a stand-in runnable"}
      - {kind: record, ref: integrations/evidence/adapter-validation.md}
    verified_with: langchain-core 1.7.7
    verified_on: "2026-11-10"
  - id: llamaindex-adapter
    name: LlamaIndex adapter
    group: framework_adapter
    status: validated
    logo: null
    chip: LI
    summary: Makes a LlamaIndex query engine callable, with the retrieved nodes as chunks.
    where: cli/src/verano/adapters.py
    evidence:
      - {kind: test, ref: cli/tests/test_adapters_real.py, note: "a real index and query engine with a mock model"}
      - {kind: test, ref: cli/tests/test_integrations.py, note: "and against a stand-in engine"}
      - {kind: record, ref: integrations/evidence/adapter-validation.md}
    verified_with: llama-index-core 0.14.25
    verified_on: "2026-11-10"
  - id: openai-adapter
    name: OpenAI SDK adapter
    group: framework_adapter
    status: validated
    logo: null
    chip: OAI
    summary: Uses an OpenAI client for chat completions and reports the tool calls a model makes.
    where: cli/src/verano/adapters.py
    evidence:
      - {kind: test, ref: cli/tests/test_adapters_real.py, note: "the real SDK against a local stand-in server"}
      - {kind: test, ref: cli/tests/test_integrations.py, note: "and against a stand-in client"}
      - {kind: record, ref: integrations/evidence/adapter-validation.md}
    verified_with: openai 3.49.0 (against a local stand-in server, not the hosted API)
    verified_on: "2026-11-10"

