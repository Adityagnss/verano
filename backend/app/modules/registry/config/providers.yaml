# Provider catalog: every provider Verano can talk to, described as data.
# Adding an OpenAI-compatible provider is a new entry here and nothing else. A provider
# with its own API shape adds one plugin in registry/plugins/ and names it in `client`.
# rate_limits are only starting defaults: users can override them per credential, and the
# gateway adapts them from response headers and observed 429s (DEVELOPMENT.md 1.4).

tunable_parameters:
  temperature: {min: 0.0, max: 2.0}
  top_p: {min: 0.0, max: 1.0}
  max_tokens: {min: 1}
  seed: {}
  presence_penalty: {min: -2.0, max: 2.0}
  frequency_penalty: {min: -2.0, max: 2.0}
  stop: {}

json_mode_parameter: response_format

rate_limit_headers:
  limit_requests: [x-ratelimit-limit-requests, llm_provider-anthropic-ratelimit-requests-limit]
  remaining_requests: [x-ratelimit-remaining-requests, llm_provider-anthropic-ratelimit-requests-remaining]
  limit_tokens: [x-ratelimit-limit-tokens, llm_provider-anthropic-ratelimit-tokens-limit]
  remaining_tokens: [x-ratelimit-remaining-tokens, llm_provider-anthropic-ratelimit-tokens-remaining]
  retry_after: [retry-after, llm_provider-retry-after]

providers:
  openai:
    display_name: OpenAI
    client: openai_compatible
    litellm_prefix: openai
    base_url: https://api.openai.com/v1
    requires_key: true
    listing: {items_path: data}
    exclude_id_patterns: [embedding, whisper, tts, dall-e, moderation, davinci, babbage, realtime, audio, transcribe, image, search, computer-use, sora, codex]
    rate_limits: {rpm: 500, tpm: 200000}

  anthropic:
    display_name: Anthropic
    client: anthropic
    litellm_prefix: anthropic
    base_url: https://api.anthropic.com
    api_version: "2023-06-01"
    requires_key: true
    parameter_ranges:
      temperature: {max: 1.0}
    unsupported_parameters: [seed, presence_penalty, frequency_penalty]
    rate_limits: {rpm: 50, tpm: 40000}

  gemini:
    display_name: Google Gemini
    client: gemini
    litellm_prefix: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    requires_key: true
    auth_error_markers: [API_KEY_INVALID]
    rate_limits: {rpm: 15, tpm: 250000}

  groq:
    display_name: Groq
    client: openai_compatible
    litellm_prefix: groq
    base_url: https://api.groq.com/openai/v1
    requires_key: true
    listing:
      items_path: data
      fields: {context_window: context_window, max_output_tokens: max_completion_tokens}
      chat_rules: [{path: active, equals: true}]
    exclude_id_patterns: [whisper, guard, tts, distil]
    rate_limits: {rpm: 30, tpm: 6000}

  mistral:
    display_name: Mistral
    client: openai_compatible
    litellm_prefix: mistral
    base_url: https://api.mistral.ai/v1
    requires_key: true
    listing:
      items_path: data
      fields: {context_window: max_context_length, display_name: name}
      chat_rules: [{path: capabilities.completion_chat, equals: true}]
    exclude_id_patterns: [embed, moderation, ocr]
    rate_limits: {rpm: 60, tpm: 500000}

  together:
    display_name: Together AI
    client: openai_compatible
    litellm_prefix: together_ai
    base_url: https://api.together.xyz/v1
    requires_key: true
    listing:
      items_path: ""
      fields: {context_window: context_length, display_name: display_name, input_price: pricing.input, output_price: pricing.output}
      price_unit: per_million_tokens
      chat_rules: [{path: type, equals: chat}]
    rate_limits: {rpm: 60, tpm: 500000}

  openrouter:
    display_name: OpenRouter
    client: openai_compatible
    litellm_prefix: openrouter
    base_url: https://openrouter.ai/api/v1
    requires_key: true
    listing:
      items_path: data
      fields:
        display_name: name
        context_window: context_length
        max_output_tokens: top_provider.max_completion_tokens
        input_price: pricing.prompt
        output_price: pricing.completion
        supported_parameters: supported_parameters
      price_unit: per_token
      chat_rules: [{path: architecture.output_modalities, contains: text}]
    rate_limits: {rpm: 60, tpm: 1000000}

  ollama:
    display_name: Ollama (local)
    client: ollama
    litellm_prefix: ollama_chat
    base_url_setting: ollama_base_url
    requires_key: false
    free: true
    rate_limits: {rpm: 600, tpm: 10000000}

  mock:
    display_name: Mock (development)
    client: mock
    litellm_prefix: mock
    requires_key: false
    enabled_setting: mock_provider_enabled
    rate_limits: {rpm: 100000, tpm: 1000000000}
