[project]
name = "verano"
version = "0.1.0"
description = "Verano: LLM experimentation and prompt optimization studio"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "litellm>=1.50",
    "httpx>=0.27",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-testmon>=2.1",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.8",
    "types-PyYAML",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PIE", "RET", "ERA"]
ignore = ["RUF012", "B008", "N818", "UP046", "UP047", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["migrations/versions/"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["app.modules.*.domain", "app.modules.*.service"]
strict = true

[[tool.mypy.overrides]]
module = ["litellm.*", "celery.*", "testcontainers.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -p app"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: pure domain tests, no I/O",
    "integration: real Postgres + Valkey via Testcontainers, mock provider",
    "ollama: needs a running local Ollama (opt-in, VERANO_TEST_OLLAMA=1)",
    "auth", "projects", "registry", "gateway", "engine", "evaluation", "edge",
]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:Item .* on TypedDict class .* is using the `ReadOnly` qualifier:UserWarning",
]
