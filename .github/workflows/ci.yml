# CI calls `make ci` and nothing else, so what runs here is exactly what runs locally and
# the two can never drift (ENGINEERING_STANDARDS 6, 8). This file only provides the
# machine: the toolchains, dependency caches, and Postgres + Valkey as service containers,
# which the test suite finds through VERANO_TEST_DATABASE_URL / VERANO_TEST_VALKEY_URL.
# Any other CI system needs the same three things and the same one command.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: verano
          POSTGRES_PASSWORD: verano
          POSTGRES_DB: verano_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verano -d verano_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.10-alpine3.24
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERANO_TEST_DATABASE_URL: postgresql+asyncpg://verano:verano@localhost:5432/verano_test
      VERANO_TEST_VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make ci
