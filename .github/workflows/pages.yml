# Builds the website (website/) and deploys it to GitHub Pages. The deploy job does nothing while the repository is private,
# because GitHub Pages needs a public repository on the free plan.
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "integrations/**"
      - "README.md"
      - "cli/README.md"
      - ".github/actions/verano-run/README.md"
      - "examples/**"
      - "frontend/src/lib/api/openapi.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" comes from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/configure-pages@v5
        if: ${{ github.event.repository.private == false }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
