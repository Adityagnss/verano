# Verano services. `make up` starts the stack; `make up-local` adds an Ollama container.
# Startup order is enforced with health checks: postgres and valkey must be healthy, then the
# one-off `migrate` job must finish successfully, and only then do backend and worker start,
# so two containers can never race to run migrations. The backend image is built once (by
# `backend`) and reused by `migrate` and `worker`. Builds use local copies of the base
# images when `make base-images` has fetched them (infra/base-images.lock), so they work
# offline.
# Caddy is the only entry point (http://localhost:8080 by default, ADR 0006). Backend and
# frontend publish no ports; the backend trusts X-Forwarded-For only from Caddy's fixed
# address on the private `edge` network. Postgres and Valkey are bound to 127.0.0.1 only,
# for local tools and benchmarks.
name: verano

x-backend: &backend
  image: verano-backend:dev
  pull_policy: never
  env_file: .env
  environment:
    VERANO_DATABASE_URL: postgresql+asyncpg://verano:${POSTGRES_PASSWORD:-verano}@postgres:5432/verano
    VERANO_VALKEY_URL: redis://valkey:6379/0
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    VERANO_TRUSTED_PROXIES: '["${CADDY_ADDRESS:-172.28.0.250}"]'
    VERANO_MOCK_PROVIDER_ENABLED: ${VERANO_MOCK_PROVIDER_ENABLED:-false}
    VERANO_STORAGE_ROOT: /srv/data
    VERANO_EMBEDDING_CACHE_DIR: /srv/data/models
    VERANO_SANDBOX_URL: http://sandbox:8099
  volumes:
    - files:/srv/data
  networks: [edge, checks]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.15-alpine3.24
    networks: [edge]
    environment:
      POSTGRES_USER: verano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verano}
      POSTGRES_DB: verano
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verano -d verano"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24
    networks: [edge]
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: ./backend
      dockerfile: ../infra/backend.Dockerfile
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--beat", "--queues", "default,generation,evaluation", "--concurrency", "4", "--loglevel", "INFO"]
    stop_signal: SIGTERM
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs users' custom code checks (ADR 0019). No internet, no database, no secrets: it sits on an internal-only
  # network that only the backend and the worker share, with a read-only filesystem and tight limits.
  sandbox:
    image: verano-backend:dev
    pull_policy: never
    command: ["python", "-m", "app.sandbox.server"]
    networks: [checks]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    environment:
      VERANO_SANDBOX_WALL_S: ${VERANO_SANDBOX_WALL_S:-5.0}
      VERANO_SANDBOX_CPU_S: ${VERANO_SANDBOX_CPU_S:-3}
      VERANO_SANDBOX_MEMORY_MB: ${VERANO_SANDBOX_MEMORY_MB:-256}
      VERANO_SANDBOX_OUTPUT_CHARS: ${VERANO_SANDBOX_OUTPUT_CHARS:-2000}
      VERANO_SANDBOX_CONCURRENCY: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8099/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/frontend.Dockerfile
    image: verano-frontend:dev
    pull_policy: build
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      VERANO_SITE_ADDRESS: ${VERANO_SITE_ADDRESS:-:80}
    ports:
      - "${VERANO_HTTP_PORT:-8080}:80"
      - "${VERANO_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_ADDRESS:-172.28.0.250}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/edge-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.4
    profiles: ["local"]
    networks: [edge]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # A local mail catcher for trying invites and email verification without a real mail server:
  # `docker compose --profile mail up`, then set VERANO_SMTP_HOST=mail, VERANO_SMTP_PORT=1025,
  # VERANO_SMTP_STARTTLS=false. Open the caught emails at http://127.0.0.1:8025. (Image tag not yet pulled.)
  mail:
    image: axllent/mailpit:v1.21.8
    profiles: ["mail"]
    networks: [edge]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

networks:
  checks:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${VERANO_DOCKER_SUBNET:-172.28.0.0/24}

volumes:
  files:
  caddy-data:
  caddy-config:
  postgres-data:
  valkey-data:
  ollama-models:
